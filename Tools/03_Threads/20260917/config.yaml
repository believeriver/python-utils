credentials:
  usernames:
    admin:
      name: admin
      # パスワード生成: python -c "import streamlit_authenticator as sa; print(sa.Hasher(['password']).generate())"
      password: "admin"
      role: admin           # admin / viewer
    viewer01:
      name: 閲覧ユーザー01
      password: "viewer01"
      role: viewer

cookie:
  name: switch_monitor_auth
  key: "change_this_to_a_random_secret_string_32chars"   # 必ず変更すること
  expiry_days: 1

# ロール別アクセス制御
roles:
  admin:
    can_refresh: true      # 再取得ボタンの表示
    can_download: true     # CSVダウンロードの表示
    can_view_topology: true
    can_edit_switch: true    # 追加
  viewer:
    can_refresh: false
    can_download: false
    can_view_topology: false
    can_edit_switch: false   # 追加
