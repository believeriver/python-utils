<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        console.log('Fetching tweets...');
        console.log('token:', localStorage.getItem('token')); // Check if the token is stored correctly
        $.ajax({
            url: 'http://127.0.0.1:8000/api/v1/tweets/',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                console.log(data);
                data.forEach(function(tweet) {
                    $('#comments-list').append('<li>' + tweet.content + '</li>');
                });
            },
            error: function(xhr, status, error) {
                console.error('Error fetching tweets:', error);
            }
        });
    </script>
    <title>Title</title>
</head>
<body>
    <ul id="comments-list">

    </ul>
</body>
</html>
